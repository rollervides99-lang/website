<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dakota Insights | Roberto Ollervides</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-top">
      <div class="brand">
        <span class="brand-flag">Dakota</span>
        <span class="brand-divider" aria-hidden="true">|</span>
        <span class="brand-name">Roberto Ollervides</span>
      </div>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation" aria-label="Open navigation menu">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav-links" id="primary-navigation">
        <a href="index.html">Home</a>
        <a href="methodology.html">Research methodology</a>
        <a href="performance-current.html">Performance</a>
        <a href="index.html#contact">Contact</a>
      </nav>
    </div>

  </header>

  <footer class="footer">
    <div class="container footer-inner">
      <p>rollervides.com</p>
    </div>
  </footer>
  <script>
    const header = document.querySelector('.header-top');
    const menuButton = document.querySelector('.nav-toggle');
    menuButton.addEventListener('click', () => {
      const isOpen = header.classList.toggle('menu-open');
      menuButton.setAttribute('aria-expanded', String(isOpen));
      menuButton.setAttribute('aria-label', isOpen ? 'Close navigation menu' : 'Open navigation menu');
    });
    document.querySelectorAll('.nav-links a').forEach((link) => {
      link.addEventListener('click', () => {
        header.classList.remove('menu-open');
        menuButton.setAttribute('aria-expanded', 'false');
        menuButton.setAttribute('aria-label', 'Open navigation menu');
      });
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        header.classList.remove('menu-open');
        menuButton.setAttribute('aria-expanded', 'false');
        menuButton.setAttribute('aria-label', 'Open navigation menu');
      }
    });
  </script>
</body>
</html>
